<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MetaPIC – Preleva colore</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        /* Nearly invisible, but not fully transparent, so the window still receives the mouse.
           The overlay is excluded from screen capture, so this tint never reaches the samples. */
        background: rgba(0, 0, 0, 0.01);
        cursor: crosshair;
        user-select: none;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, -apple-system, sans-serif;
      }
      #loupe {
        position: fixed;
        left: 0;
        top: 0;
        pointer-events: none;
        display: none;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.6);
        background: #111;
      }
      #zoom {
        display: block;
        width: 165px;
        height: 165px;
        image-rendering: pixelated;
      }
      /* 165px / 11 pixels = 15px per pixel; moved to the cursor's pixel by script. */
      #center {
        position: absolute;
        left: 74px;
        top: 74px;
        width: 15px;
        height: 15px;
        border: 1px solid #fff;
        box-shadow: 0 0 0 1px #000;
      }
      #label {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        color: #fff;
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      #chip {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5);
      }
      #rgb {
        color: #aaa;
        font-size: 12px;
      }
      #help {
        position: fixed;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        pointer-events: none;
        padding: 8px 14px;
        border-radius: 8px;
        background: rgba(17, 17, 17, 0.85);
        color: #fff;
        font-size: 13px;
        transition: opacity 0.3s;
      }
    </style>
    <script type="module" src="/src/picker.ts" defer></script>
  </head>
  <body>
    <div id="help">Muovi il puntatore dove vuoi · clic per prelevare · frecce per spostarti di un pixel · Esc per annullare</div>
    <div id="loupe">
      <canvas id="zoom" width="11" height="11"></canvas>
      <div id="center"></div>
      <div id="label"><span id="chip"></span><span id="hex">#000000</span><span id="rgb"></span></div>
    </div>
  </body>
</html>
