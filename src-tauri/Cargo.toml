[package]
name = "metapic"
version = "0.1.0"
description = "MetaPIC: convertitore di immagini nei formati moderni"
authors = ["Davide Giansoldati <davide@contentisking.guru>", "Content is king Srl"]
license = "MIT"
repository = "https://github.com/davide-cik/MetaPIC"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "metapic_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "bmp", "tiff", "ico", "webp", "qoi", "rayon"] }
webp = { version = "0.3.1", default-features = false }
ravif = { version = "0.13.0", default-features = false, features = ["threading"] }
jxl-oxide = { version = "0.12.6", features = ["image"] }
zune-jpegxl = "0.5.2"
zune-core = "0.5.3"
little_exif = "0.6.23"
rayon = "1.12.0"
anyhow = "1.0.104"
avif-decode = { version = "3.0.0", default-features = false, optional = true }
tauri-plugin-dialog = "2.8.3"
bytemuck = "1.25.2"
base64 = "0.23.1"
rgb = "0.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[features]
default = ["avif-read"]
# AVIF decoding via rav1d; its assembly needs NASM on the build machine.
avif-read = ["dep:avif-decode"]
